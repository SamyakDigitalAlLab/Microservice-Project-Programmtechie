spring.application.name=api-gateway

server.port=8080

# =========================================================
# EUREKA
# =========================================================

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/


# =========================================================
# PRODUCT SERVICE
# =========================================================

spring.cloud.gateway.server.webmvc.routes[0].id=product-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://product-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/product/**


# =========================================================
# ORDER SERVICE
# =========================================================

spring.cloud.gateway.server.webmvc.routes[1].id=order-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/order/**


# =========================================================
# INVENTORY SERVICE
# =========================================================

spring.cloud.gateway.server.webmvc.routes[2].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://inventory-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/inventory/**


# =========================================================
# EUREKA WEB
# =========================================================

spring.cloud.gateway.server.webmvc.routes[3].id=discovery-service
spring.cloud.gateway.server.webmvc.routes[3].uri=http://eureka-server:8761
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/eureka/web
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=SetPath=/

# =========================
# PRODUCT SWAGGER
# =========================

spring.cloud.gateway.server.webmvc.routes[4].id=product-swagger
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://product-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/product/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=SetPath=/v3/api-docs


# =========================
# ORDER SWAGGER
# =========================

spring.cloud.gateway.server.webmvc.routes[5].id=order-swagger
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/order/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=SetPath=/v3/api-docs


# =========================
# INVENTORY SWAGGER
# =========================

spring.cloud.gateway.server.webmvc.routes[6].id=inventory-swagger
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://inventory-service
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/inventory/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[6].filters[0]=SetPath=/v3/api-docs

# =========================================================
# SWAGGER UI
# =========================================================

springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/product/v3/api-docs

springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/order/v3/api-docs

springdoc.swagger-ui.urls[2].name=Inventory Service
springdoc.swagger-ui.urls[2].url=/inventory/v3/api-docs

springdoc.swagger-ui.disable-swagger-default-url=true