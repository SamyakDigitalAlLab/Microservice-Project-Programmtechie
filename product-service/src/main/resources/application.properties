spring.application.name=product-service
#spring.mongodb.uri=mongodb://localhost:27017/product-service
spring.mongodb.uri=mongodb://mongodb:27017/product-service

server.port:8083

#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.service-url.defaultZone=http://eureka:password@eureka-server:8761/eureka/

# =========================================================
# ACTUATOR / METRICS / TRACING
# =========================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
